# SilverJS's fuzz targets (docs/design.md section 1.5). Not a member of
# the engine's workspace: libFuzzer needs the nightly toolchain, and the
# engine's build must not.
#   cargo +nightly fuzz run silverjs_parse fuzz/corpus/silverjs_parse \
#     fuzz/seeds/silverjs_parse -- -dict=fuzz/silverjs_parse.dict
# CI runs each target for a minute on every push.

[package]
name = "silverjs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MPL-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
silverjs = { path = ".." }
# The independent model silverjs_bigint checks the arithmetic against: a
# test-only oracle, never part of the engine.
num-bigint = "0.4"
num-traits = "0.2"
# The independent model silverjs_regexp checks matches against, where it
# means what JavaScript means: a test-only oracle as well.
regex = "1"

[[bin]]
name = "silverjs_parse"
path = "fuzz_targets/silverjs_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "silverjs_run"
path = "fuzz_targets/silverjs_run.rs"
test = false
doc = false
bench = false

[[bin]]
name = "silverjs_gc"
path = "fuzz_targets/silverjs_gc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "silverjs_buffers"
path = "fuzz_targets/silverjs_buffers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "silverjs_bigint"
path = "fuzz_targets/silverjs_bigint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "silverjs_date"
path = "fuzz_targets/silverjs_date.rs"
test = false
doc = false
bench = false

[[bin]]
name = "silverjs_regexp"
path = "fuzz_targets/silverjs_regexp.rs"
test = false
doc = false
bench = false
